name: Companion release

on:
  push:
    tags:
      - "companion-v*"
  workflow_dispatch:

concurrency:
  group: companion-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Install Vite+
        run: npm install -g vite-plus@0.2.6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Install Wireshark (tshark payload source)
        run: choco install wireshark --params "'/NoDesktopIcon /NoDesktopShortcut /NoRebootRequired'" -y --no-progress

      - name: Install dependencies
        run: vp install

      - name: Stage tshark payload
        run: powershell -ExecutionPolicy Bypass -File apps/companion/installer/fetch-tshark-payload.ps1

      - name: Build companion MSI
        run: pnpm --dir apps/companion build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: companion-msi
          path: apps/companion/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

  publish-prerelease:
    if: startsWith(github.ref, 'refs/tags/companion-v')
    needs: build-msi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download MSI artifact
        uses: actions/download-artifact@v4
        with:
          name: companion-msi
          path: dist

      - name: Publish GitHub pre-release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
